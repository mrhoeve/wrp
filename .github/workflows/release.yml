name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Optional major.minor.patch override; leave empty to use the POM snapshot version"
        required: false
        type: string
      confirm_release:
        description: "I confirm that this version may be published"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE_NAME: mrhoeve/wrp

jobs:
  release:
    name: Verify and publish release
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release request
        env:
          CONFIRM_RELEASE: ${{ inputs.confirm_release }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must be started from main; selected ref is $GITHUB_REF" >&2
            exit 1
          fi
          if [[ "$CONFIRM_RELEASE" != "true" ]]; then
            echo "The release confirmation was not selected" >&2
            exit 1
          fi
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "Repository variable DOCKERHUB_USERNAME and secret DOCKERHUB_TOKEN are required" >&2
            exit 1
          fi
          git fetch origin main --tags
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "The selected revision is not the current origin/main" >&2
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Test release version logic
        run: scripts/test-release-version.sh

      - name: Prepare release version
        id: version
        env:
          RELEASE_VERSION_OVERRIDE: ${{ inputs.release_version }}
        run: |
          arguments=(--output-file "$GITHUB_OUTPUT")
          if [[ -n "$RELEASE_VERSION_OVERRIDE" ]]; then
            arguments+=(--release-version "$RELEASE_VERSION_OVERRIDE")
          fi
          scripts/prepare-release.sh "${arguments[@]}"

      - name: Reject an existing release
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_VERSION"; then
            echo "Tag $RELEASE_VERSION already exists" >&2
            exit 1
          fi
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "GitHub release $RELEASE_VERSION already exists" >&2
            exit 1
          fi
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release build
        run: ./mvnw -B clean verify

      - name: Collect release assets
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: |
          mkdir -p dist
          mapfile -t jars < <(find target -maxdepth 1 -type f -name '*.jar' ! -name '*.original' -print)
          if (( ${#jars[@]} != 1 )); then
            echo "Expected exactly one application JAR, found ${#jars[@]}" >&2
            exit 1
          fi
          cp "${jars[0]}" "dist/wrp-$RELEASE_VERSION.jar"
          cp target/classes/META-INF/sbom/application.cdx.json "dist/wrp-$RELEASE_VERSION-sbom.cdx.json"
          sha256sum dist/* > "dist/wrp-$RELEASE_VERSION-sha256.txt"

      - name: Retain release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.version.outputs.release_version }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Create release commit
        id: release_commit
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pom.xml
          git commit -m "release: $RELEASE_VERSION"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build release candidate
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:release-candidate-${{ github.run_id }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

      - name: Scan release candidate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:release-candidate-${{ github.run_id }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Generate container tags
        id: container
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: |
          IFS=. read -r major minor _ <<< "$RELEASE_VERSION"
          {
            echo 'tags<<EOF'
            echo "$IMAGE_NAME:$RELEASE_VERSION"
            echo "$IMAGE_NAME:$major.$minor"
            echo "$IMAGE_NAME:$major"
            echo "$IMAGE_NAME:latest"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish container image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.container.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release_commit.outputs.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.release_version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

      - name: Commit next development version
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: |
          git tag -a "$RELEASE_VERSION" -m "Release $RELEASE_VERSION" "${{ steps.release_commit.outputs.sha }}"
          ./mvnw -B org.codehaus.mojo:versions-maven-plugin:2.21.0:set \
            -DnewVersion="$NEXT_VERSION" \
            -DgenerateBackupPoms=false \
            -DprocessAllModules=true
          effective_version="$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version | tr -d '\r' | tail -n 1)"
          if [[ "$effective_version" != "$NEXT_VERSION" ]]; then
            echo "Expected next POM version $NEXT_VERSION, found $effective_version" >&2
            exit 1
          fi
          git add pom.xml
          git commit -m "chore: prepare $NEXT_VERSION"

      - name: Push release atomically
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: git push --atomic origin "HEAD:refs/heads/main" "refs/tags/$RELEASE_VERSION"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: |
          arguments=(
            "$RELEASE_VERSION"
            dist/*
            --verify-tag
            --title "WRP $RELEASE_VERSION"
            --generate-notes
            --latest
          )
          notes_file="docs/releases/$RELEASE_VERSION.md"
          if [[ -f "$notes_file" ]]; then
            arguments+=(--notes "$(cat "$notes_file")")
          fi
          gh release create "${arguments[@]}"
